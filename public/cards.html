<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profiles | Attendance Bloom</title>
  <link rel="icon" type="image/png" href="/assets/images/tvtc.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/images/tvtc.png" alt="Logo" class="sidebar-logo">
        <div class="sidebar-title">
          <h2><i data-lucide="flower-2" style="width: 18px; height: 18px; color: var(--accent);"></i> Bloom</h2>
          <p data-setting="institute_short_name" class="brand-short-name">LSA</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a href="cards.html" class="nav-item active">
          <i data-lucide="id-card"></i>
          <span>Student Profiles</span>
        </a>
        <a href="attendance.html" class="nav-item">
          <i data-lucide="qr-code"></i>
          <span>Attendance Scanner</span>
        </a>
        <a href="summary.html" class="nav-item">
          <i data-lucide="bar-chart-3"></i>
          <span>Reports & Logs</span>
        </a>
        <a href="admin.html" class="nav-item">
          <i data-lucide="shield-check"></i>
          <span>Admin Site</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-navbar">
        <button class="mobile-toggle" id="mobile-toggle">
          <i data-lucide="menu"></i>
        </button>
        <div class="brand-header-title">
          <i data-lucide="flower-2"></i>
          <span>Attendance Bloom &bull; Student Directory</span>
        </div>
        <div class="user-badge">
          <div class="user-avatar" id="nav-avatar">A</div>
          <div class="user-info">
            <h4 id="nav-username">User</h4>
            <p id="nav-role">Role</p>
          </div>
        </div>
      </header>

      <div class="page-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Student Profiles & ID Cards</h1>
            <p class="page-subtitle">View enrolled students, inspect generated QR codes, and create new ID cards.</p>
          </div>
          <div style="display: flex; gap: 12px;">
            <a href="create-card.html" class="btn btn-primary">
              <i data-lucide="plus-circle"></i>
              <span>Create New Card</span>
            </a>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="card-box" style="margin-bottom: 32px; padding: 16px 24px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <i data-lucide="search" style="color: var(--accent); width: 20px; height: 20px;"></i>
            <input type="text" id="search-students" class="form-control" style="border: none; background: transparent; padding: 8px 0;" placeholder="Search by student name, ID number, or department...">
          </div>
        </div>

        <!-- Dynamic Cards Grid -->
        <div id="student-grid" class="student-grid">
          <!-- Loaded dynamically via cards.js -->
        </div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/cards.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
