<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Attendance Bloom - LSA</title>
  <link rel="icon" type="image/png" href="/assets/images/tvtc.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-body">

  <div class="login-card">
    <img src="/assets/images/tvtc.png" alt="Logo" class="login-logo" onerror="this.src='/assets/students/user.png'">
    <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <i data-lucide="flower-2" style="width: 24px; height: 24px; color: var(--accent);"></i>
      <span>Attendance Bloom</span>
    </h2>
    <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; font-weight: 600;" data-setting="institute_name" class="brand-institute-name">Lotus Skills Academy</p>

    <div id="login-alert" style="display: none; background: var(--error-bg); color: var(--error); border: 1px solid rgba(231, 111, 81, 0.3); border-radius: var(--radius-md); padding: 12px; font-size: 0.88rem; margin-bottom: 20px;"></div>

    <form id="login-form">
      <div class="form-group" style="text-align: left;">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
      </div>

      <div class="form-group" style="text-align: left;">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 14px;">
        <span>Sign In</span>
      </button>
    </form>

    <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-muted); font-weight: 600;">
      Attendance Bloom Portal v2.0 &bull; <span data-setting="institute_short_name" class="brand-short-name">LSA</span>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
